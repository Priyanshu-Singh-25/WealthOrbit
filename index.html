<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wealth Orbit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="bg"></div>
<div class="bg2"></div>
<div class="bg3"></div>

<div class="container">

<div class="header">
<h1>🚀 Wealth Orbit</h1>
<p>Track • Analyze • Grow Your Wealth</p>
</div>

<div class="hero card">
<div>Current Balance</div>
<div class="balance" id="bal">₹0</div>
</div>

<div class="stats">

<div class="card stat">
<small>Income</small>
<h3 id="inc">₹0</h3>
</div>

<div class="card stat">
<small>Expense</small>
<h3 id="exp">₹0</h3>
</div>

<div class="card stat">
<small>Transactions</small>
<h3 id="count">0</h3>
</div>

<div class="card stat">
<small>Top Expense</small>
<h3 id="high">₹0</h3>
</div>

</div>

<div class="layout">

<div class="card panel">

<h2>📊 Transactions</h2>

<input
id="search"
class="search"
placeholder="Search Transactions">

<div class="filters">
<button onclick="setFilter('all')">All</button>
<button onclick="setFilter('income')">Income</button>
<button onclick="setFilter('expense')">Expense</button>
</div>

<div id="list" class="list"></div>

</div>

<div>

<div class="card panel">

<h2>➕ Add Transaction</h2>

<label>Description</label>
<input id="desc">

<label>Amount</label>
<input id="amt" type="number">

<label>Category</label>
<select id="cat">
<option>🍔 Food</option>
<option>🚗 Transport</option>
<option>🛒 Shopping</option>
<option>🏠 Rent</option>
<option>💰 Salary</option>
<option>📈 Investment</option>
</select>

<label>Type</label>
<select id="type">
<option value="income">Income</option>
<option value="expense">Expense</option>
</select>

<button
id="saveBtn"
class="primary"
onclick="saveTransaction()">
Add Transaction
</button>

<div class="quick">
<button onclick="quick('Salary',50000,'💰 Salary','income')">Salary</button>
<button onclick="quick('Food',300,'🍔 Food','expense')">Food</button>
<button onclick="quick('Fuel',500,'🚗 Transport','expense')">Fuel</button>
<button onclick="quick('Rent',10000,'🏠 Rent','expense')">Rent</button>
</div>

</div>

<div class="card panel budget-card">

<h2>🎯 Budget Tracker</h2>

<input
id="budget"
type="number"
placeholder="Monthly Budget">

<div class="progress">
<div id="bar" class="bar"></div>
</div>

<p id="budgetText">
Set a budget
</p>

</div>

</div>

</div>

</div>

<div id="toast" class="toast"></div>

<script src="./script.js"></script>
</body>
</html>
